<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Yakın Apartmanı Aidat</title><style>
:root{--bg:#fff;--card:#f6eef1;--ink:#2a1a20;--mut:#6b5a61;--b:#7a1f3d;--ln:#d9c6ce;--ok:#1e7b4f;--okb:#d6efdf;--wa:#9a5b00;--wab:#ffe7b8;--no:#b3261e;--nob:#fbdedb}
@media (prefers-color-scheme:dark){:root{--bg:#17100f;--card:#261a1e;--ink:#f3e9ec;--mut:#b9a6ad;--b:#e0869f;--ln:#4a363d;--ok:#7fd6a4;--okb:#18382a;--wa:#f2c46d;--wab:#3d2f12;--no:#ff9b94;--nob:#42201d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Arial,Helvetica,sans-serif}
.w{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{color:var(--b);font-size:20px;margin:0;text-align:center;letter-spacing:.5px}
.s{color:var(--mut);text-align:center;margin:2px 0 18px;font-size:14px;letter-spacing:3px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:14px}
.who{font-size:13px;color:var(--mut)}.nm{font-size:22px;font-weight:700;color:var(--b)}
.big{font-size:34px;font-weight:700;margin-top:6px}.big.ok{color:var(--ok)}.big.no{color:var(--no)}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.m{border-radius:10px;padding:10px 6px;text-align:center;border:1px solid var(--ln);font-size:13px}
.m b{display:block;font-size:14px;margin-bottom:2px}.m.ok{background:var(--okb);color:var(--ok)}.m.pa{background:var(--wab);color:var(--wa)}.m.no{background:var(--nob);color:var(--no)}.m.fu{color:var(--mut)}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--ln);font-size:14px}.row:last-child{border:0}
.up{color:var(--mut);font-size:12px;text-align:center}
input,select{width:100%;padding:10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;text-align:center}
.g label{font-size:12px;color:var(--mut);display:block;text-align:center}
button{background:var(--b);color:var(--bg);border:0;border-radius:10px;padding:14px 18px;font:700 16px Arial;cursor:pointer;width:100%;margin-top:10px}
#msg{margin-top:10px;font-size:14px;text-align:center}
</style></head><body><div class="w"><h1>YAKIN APARTMANI</h1><div class="s">2026 AİDAT DURUMU</div><div id="app"></div></div>
<script>
var NO=7, AD="Osman Atlar";
var AY=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
var app=document.getElementById('app');
function tl(n){return Number(n||0).toLocaleString('tr-TR')+' ₺'}
fetch('data.json?t='+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(D){
 var O=(D.odemeler[NO]||[]).slice();while(O.length<12)O.push(0);
 var A=D.aidat,n=new Date(),k=n.getFullYear()<2026?0:n.getFullYear()>2026?12:n.getMonth()+1;
 var top2=O.reduce(function(a,b){return a+(+b||0)},0),kalan=A*k-top2;
 var t=kalan>0?'Kalan borcunuz':kalan<0?'Fazla ödemeniz':'Borcunuz yok';
 var h='<div class="card"><div class="who">Daire '+NO+'</div><div class="nm">'+AD+'</div><div class="who" style="margin-top:12px">'+t+'</div><div class="big '+(kalan>0?'no':'ok')+'">'+tl(Math.abs(kalan))+'</div></div><div class="card"><div class="g">';
 for(var i=0;i<12;i++){var v=+O[i]||0,c,x;
  if(v>=A){c='ok';x='✓ '+tl(v)}else if(v>0){c='pa';x=tl(v)+' (eksik)'}else if(i<k){c='no';x='Ödenmedi'}else{c='fu';x='—'}
  h+='<div class="m '+c+'"><b>'+AY[i]+'</b>'+x+'</div>'}
 h+='</div></div><div class="card"><div class="row"><span>Aylık aidat</span><b>'+tl(A)+'</b></div><div class="row"><span>Bugüne kadar ödenen</span><b>'+tl(top2)+'</b></div></div>';
 if(D.guncelleme)h+='<div class="up">Son güncelleme: '+D.guncelleme+'</div>';
 app.innerHTML=h}).catch(function(){app.innerHTML='<div class="card" style="text-align:center">Bilgiler yüklenemedi. Lütfen biraz sonra tekrar deneyin.</div>'});
</script></body></html>
