<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Yakın Apartmanı Aidat</title><style>
:root{--bg:#fff;--card:#f6eef1;--ink:#2a1a20;--mut:#6b5a61;--b:#7a1f3d;--ln:#d9c6ce;--ok:#1e7b4f;--okb:#d6efdf;--wa:#9a5b00;--wab:#ffe7b8;--no:#b3261e;--nob:#fbdedb}
@media (prefers-color-scheme:dark){:root{--bg:#17100f;--card:#261a1e;--ink:#f3e9ec;--mut:#b9a6ad;--b:#e0869f;--ln:#4a363d;--ok:#7fd6a4;--okb:#18382a;--wa:#f2c46d;--wab:#3d2f12;--no:#ff9b94;--nob:#42201d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Arial,Helvetica,sans-serif}
.w{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{color:var(--b);font-size:20px;margin:0;text-align:center;letter-spacing:.5px}
.s{color:var(--mut);text-align:center;margin:2px 0 18px;font-size:14px;letter-spacing:3px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:14px}
.who{font-size:13px;color:var(--mut)}.nm{font-size:22px;font-weight:700;color:var(--b)}
.big{font-size:34px;font-weight:700;margin-top:6px}.big.ok{color:var(--ok)}.big.no{color:var(--no)}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.m{border-radius:10px;padding:10px 6px;text-align:center;border:1px solid var(--ln);font-size:13px}
.m b{display:block;font-size:14px;margin-bottom:2px}.m.ok{background:var(--okb);color:var(--ok)}.m.pa{background:var(--wab);color:var(--wa)}.m.no{background:var(--nob);color:var(--no)}.m.fu{color:var(--mut)}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--ln);font-size:14px}.row:last-child{border:0}
.up{color:var(--mut);font-size:12px;text-align:center}
input,select{width:100%;padding:10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;text-align:center}
.g label{font-size:12px;color:var(--mut);display:block;text-align:center}
button{background:var(--b);color:var(--bg);border:0;border-radius:10px;padding:14px 18px;font:700 16px Arial;cursor:pointer;width:100%;margin-top:10px}
#msg{margin-top:10px;font-size:14px;text-align:center}
</style></head><body><div class="w"><h1>YAKIN APARTMANI</h1><div class="s">YÖNETİCİ SAYFASI</div><div id="app"></div></div>
<script>
var REPO="faruk271/yakin-apartmani",FILE="data.json",API="https://api.github.com/repos/"+REPO+"/contents/"+FILE;
var DAIRE=[{"no": 1, "ad": "Murat Şarlak"}, {"no": 2, "ad": "Muharrem Işık"}, {"no": 3, "ad": "Ahmet Geran"}, {"no": 4, "ad": "Yaşar Köykıran"}, {"no": 5, "ad": "Sevim Yakın"}, {"no": 6, "ad": "Murat Ayber"}, {"no": 7, "ad": "Osman Atlar"}, {"no": 8, "ad": "Ali Paşa Oksay"}, {"no": 9, "ad": "Mehmet Ateş"}, {"no": 10, "ad": "Kemal Kırtıl"}];
var AY=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
var app=document.getElementById('app'),D=null,TOKEN='';
try{TOKEN=localStorage.getItem('gh_token')||''}catch(e){}
function msg(t,c){var m=document.getElementById('msg');if(m){m.textContent=t;m.style.color=c||'var(--mut)'}}
function setup(){
 app.innerHTML='<div class="card"><b>İlk kurulum (bir kere)</b><p style="font-size:14px;color:var(--mut)">Kaydet düğmesinin çalışması için GitHub anahtarını (token) buraya yapıştırın. Anahtar sadece bu telefonda saklanır.</p><input id="tk" placeholder="github_pat_..." autocomplete="off"><button id="ts">Anahtarı kaydet</button></div>';
 document.getElementById('ts').onclick=function(){var v=document.getElementById('tk').value.trim();if(!v)return;try{localStorage.setItem('gh_token',v)}catch(e){}TOKEN=v;load()}}
function load(){
 app.innerHTML='<div class="card" style="text-align:center">Yükleniyor…</div>';
 fetch('data.json?t='+Date.now()).then(function(r){return r.json()}).then(function(j){D=j;draw()}).catch(function(){app.innerHTML='<div class="card">data.json yüklenemedi.</div>'})}
function draw(){
 var h='<div class="card"><div class="who">Aylık aidat (₺)</div><input id="ay" type="number" value="'+D.aidat+'"></div><div class="card"><div class="who">Daire seçin</div><select id="sel">';
 DAIRE.forEach(function(d){h+='<option value="'+d.no+'">'+d.no+' - '+d.ad+'</option>'});
 h+='</select><div class="g" id="gr" style="margin-top:12px"></div></div><button id="sv">Kaydet ve yayınla</button><div id="msg"></div><div class="up" style="margin-top:14px"><a href="#" id="rs" style="color:var(--mut)">Anahtarı değiştir</a></div>';
 app.innerHTML=h;
 var sel=document.getElementById('sel');
 function grid(){var no=sel.value,o=D.odemeler[no],g='';for(var i=0;i<12;i++)g+='<div><label>'+AY[i]+'</label><input type="number" min="0" inputmode="numeric" data-i="'+i+'" value="'+(o[i]||'')+'"></div>';
  var el=document.getElementById('gr');el.innerHTML=g}
 sel.onchange=grid;grid();
 document.getElementById('gr').addEventListener('input',function(e){var t=e.target;if(t.dataset.i!==undefined)D.odemeler[sel.value][t.dataset.i]=+t.value||0});
 document.getElementById('ay').oninput=function(e){D.aidat=+e.target.value||0};
 document.getElementById('sv').onclick=save;
 document.getElementById('rs').onclick=function(e){e.preventDefault();try{localStorage.removeItem('gh_token')}catch(x){}TOKEN='';setup()}}
function b64(s){return btoa(unescape(encodeURIComponent(s)))}
function save(){
 msg('Kaydediliyor…');
 var hd={'Authorization':'Bearer '+TOKEN,'Accept':'application/vnd.github+json'};
 D.guncelleme=new Date().toLocaleString('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
 fetch(API,{headers:hd,cache:'no-store'}).then(function(r){if(r.status==401||r.status==403)throw 'tok';if(!r.ok)throw 'get';return r.json()}).then(function(f){
  return fetch(API,{method:'PUT',headers:hd,body:JSON.stringify({message:'Aidat güncellendi',content:b64(JSON.stringify(D,null,1)),sha:f.sha})})}).then(function(r){
  if(r.status==401||r.status==403)throw 'tok';if(!r.ok)throw 'put';msg('Kaydedildi ✓ Yaklaşık 1 dakika içinde QR sayfalarına yansır.','var(--ok)')}).catch(function(e){
  msg(e=='tok'?'Anahtar geçersiz ya da yetkisi yok. "Anahtarı değiştir"e basıp yenisini girin.':'Kaydedilemedi. İnternetinizi kontrol edip tekrar deneyin.','var(--no)')})}
if(TOKEN)load();else setup();
</script></body></html>
